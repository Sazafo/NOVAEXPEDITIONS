<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Expeditions - Clientes</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            Nova Expeditions
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="index.html">
                Paquetes
            </a>

            <a class="nav-link active" href="clientes.html">
                Clientes
            </a>

            <a class="nav-link" href="reservaciones.html">
                Reservaciones
            </a>

            <a class="nav-link" href="pagos.html">
                Pagos
            </a>

        </div>

    </div>

</nav>

<div class="container my-4">

    <h2 class="mb-4">
        Gestión de Clientes
    </h2>

    <div id="alertContainer"></div>

    <div class="card mb-4">

        <div class="card-header">

            <span id="formTitulo">
                Nuevo Cliente
            </span>

        </div>

        <div class="card-body">

            <form id="formCliente">

                <input type="hidden" id="clienteId">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Correo
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="telefono"
                            required>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            País
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="pais"
                            required>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Edad
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="edad"
                            min="1"
                            required>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            class="form-select"
                            id="estado"
                            required>

                            <option value="Activo">
                                Activo
                            </option>

                            <option value="Inactivo">
                                Inactivo
                            </option>

                        </select>

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnGuardar">

                        Guardar

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="btnCancelar">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <div class="card">

        <div class="card-header">
            Clientes Registrados
        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>País</th>
                        <th>Edad</th>
                        <th>Estado</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaClientes"></tbody>

            </table>

        </div>

    </div>

</div>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js">
</script>

<script src="js/clientes.js"></script>

</body>

</html>
