<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opiniones</title><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Nova Expeditions</a><a href="index.html" class="btn btn-outline-light">Inicio</a></div></nav>
<div class="container my-4"><h2>Gestión de Opiniones</h2><form id="form" class="card card-body mb-4"><input type="hidden" id="registroId"><div class="row g-3"><div class="col-md-4"><label class="form-label">cliente</label><input type="text" class="form-control" id="cliente" required></div><div class="col-md-4"><label class="form-label">paquete</label><input type="text" class="form-control" id="paquete" required></div><div class="col-md-4"><label class="form-label">calificacion</label><input type="number" class="form-control" id="calificacion" required></div><div class="col-md-4"><label class="form-label">comentario</label><input type="text" class="form-control" id="comentario" required></div><div class="col-md-4"><label class="form-label">fecha</label><input type="date" class="form-control" id="fecha" required></div></div><div class="mt-3"><button class="btn btn-primary" id="guardar">Guardar</button> <button type="button" class="btn btn-secondary" id="cancelar">Cancelar</button></div></form>
<table class="table table-striped"><thead><tr><th>cliente</th><th>paquete</th><th>calificacion</th><th>comentario</th><th>fecha</th><th>Acciones</th></tr></thead><tbody id="tabla"></tbody></table></div><script src="js/opiniones.js"></script></body></html>
