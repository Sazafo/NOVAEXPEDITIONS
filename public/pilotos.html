<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilotos</title><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Nova Expeditions</a><a href="index.html" class="btn btn-outline-light">Inicio</a></div></nav>
<div class="container my-4"><h2>Gestión de Pilotos</h2><form id="form" class="card card-body mb-4"><input type="hidden" id="registroId"><div class="row g-3"><div class="col-md-4"><label class="form-label">nombre</label><input type="text" class="form-control" id="nombre" required></div><div class="col-md-4"><label class="form-label">licencia</label><input type="text" class="form-control" id="licencia" required></div><div class="col-md-4"><label class="form-label">experienciaAnios</label><input type="number" class="form-control" id="experienciaAnios" required></div><div class="col-md-4"><label class="form-label">especialidad</label><input type="text" class="form-control" id="especialidad" required></div><div class="col-md-4"><label class="form-label">estado</label><input type="text" class="form-control" id="estado" required></div></div><div class="mt-3"><button class="btn btn-primary" id="guardar">Guardar</button> <button type="button" class="btn btn-secondary" id="cancelar">Cancelar</button></div></form>
<table class="table table-striped"><thead><tr><th>nombre</th><th>licencia</th><th>experienciaAnios</th><th>especialidad</th><th>estado</th><th>Acciones</th></tr></thead><tbody id="tabla"></tbody></table></div><script src="js/pilotos.js"></script></body></html>
