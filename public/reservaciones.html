<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Expeditions - Reservaciones</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            Nova Expeditions
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="index.html">
                Paquetes
            </a>

            <a class="nav-link" href="clientes.html">
                Clientes
            </a>

            <a class="nav-link active" href="reservaciones.html">
                Reservaciones
            </a>

            <a class="nav-link" href="pagos.html">
                Pagos
            </a>

        </div>

    </div>

</nav>

<div class="container my-4">

    <h2 class="mb-4">
        Gestión de Reservaciones
    </h2>

    <div id="alertContainer"></div>

    <div class="card mb-4">

        <div class="card-header">

            <span id="formTitulo">
                Nueva Reservación
            </span>

        </div>

        <div class="card-body">

            <form id="formReservacion">

                <input
                    type="hidden"
                    id="reservacionId">

                <div class="row g-3">

                    <!-- Cliente -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Cliente
                        </label>

                        <select
                            class="form-select"
                            id="cliente"
                            required>

                            <option value="">
                                Seleccione un cliente
                            </option>

                        </select>

                    </div>

                    <!-- Paquete -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Paquete
                        </label>

                        <select
                            class="form-select"
                            id="paquete"
                            required>

                            <option value="">
                                Seleccione un paquete
                            </option>

                        </select>

                    </div>

                    <!-- Fecha -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Fecha de reserva
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="fechaReserva"
                            required>

                    </div>

                    <!-- Personas -->
                    <div class="col-md-3">

                        <label class="form-label">
                            Cantidad de personas
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="cantidadPersonas"
                            min="1"
                            required>

                    </div>

                    <!-- Total -->
                    <div class="col-md-3">

                        <label class="form-label">
                            Total
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="total"
                            min="0"
                            required>

                    </div>

                    <!-- Estado -->
                    <div class="col-md-2">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            class="form-select"
                            id="estado"
                            required>

                            <option value="Pendiente">
                                Pendiente
                            </option>

                            <option value="Confirmada">
                                Confirmada
                            </option>

                            <option value="Cancelada">
                                Cancelada
                            </option>

                        </select>

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnGuardar">

                        Guardar

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="btnCancelar">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <div class="card">

        <div class="card-header">
            Reservaciones Registradas
        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped">

                <thead>

                <tr>

                    <th>Cliente</th>
                    <th>Paquete</th>
                    <th>Fecha</th>
                    <th>Personas</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>

                </thead>

                <tbody id="tablaReservaciones"></tbody>

            </table>

        </div>

    </div>

</div>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js">
</script>

<script src="js/reservaciones.js"></script>

</body>

</html>
