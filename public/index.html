<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Expeditions - Paquetes</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#" id="linkInicio">
                Nova Expeditions
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="linkPaquetes">Paquetes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <h2 class="mb-4">Gestión de Paquetes Turísticos</h2>

        <!-- Alertas -->
        <div id="alertContainer"></div>

        <!-- Formulario -->
        <div class="card mb-4" id="seccionFormulario">
            <div class="card-header">
                <span id="formTitulo">Nuevo Paquete</span>
            </div>
            <div class="card-body">
                <form id="formPaquete">
                    <input type="hidden" id="paqueteId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                required>
                        </div>

                        <div class="col-md-6">
                            <label for="destino" class="form-label">Destino</label>
                            <input
                                type="text"
                                class="form-control"
                                id="destino"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label for="duracionDias" class="form-label">Duración (días)</label>
                            <input
                                type="number"
                                class="form-control"
                                id="duracionDias"
                                min="1"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label for="precio" class="form-label">Precio ($)</label>
                            <input
                                type="number"
                                class="form-control"
                                id="precio"
                                min="0"
                                step="0.01"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" required>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="incluye" class="form-label">
                                Incluye (separado por comas)
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="incluye"
                                placeholder="Hotel, Transporte, Guía"
                                required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="btnGuardar">
                            Guardar
                        </button>
                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="btnCancelar">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card" id="seccionPaquetes">
            <div class="card-header">
                <span id="tituloLista">Paquetes Recientes</span>
            </div>
            <div class="card-body table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Destino</th>
                            <th>Duración</th>
                            <th>Precio</th>
                            <th>Incluye</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPaquetes">
                        <!-- Filas generadas por JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

    <!-- Script propio -->
    <script src="app.js"></script>
</body>
</html>
